---
- name: Configure freshly installed Debian
  hosts: localhost
  connection: local
  become: yes
  vars:
    root_password: "{{ root_password }}"
    centroid_password: "{{ centroid_password }}"
  tasks:
    - name: Ensure prereqs are installed
      apt:
        name:
          - systemd-timesyncd
          - python3-passlib
          - lsb-release
        state: present

    - name: Enable NTP (systemd-timesyncd)
      command: timedatectl set-ntp true
      changed_when: false

    - name: Wait for NTP sync
      shell: timedatectl show -p NTPSynchronized --value
      register: ntp_sync
      retries: 15
      delay: 2
      until: ntp_sync.stdout == "yes"
      changed_when: false

    - name: Set timezone from -e tz=... or $TZ or default
      timezone:
        name: "{{ tz | default(lookup('env','TZ'), true) | default('Atlantic/Reykjavik', true) }}"

    # --- Keep UEFI logo via Plymouth BGRT -----------
    - name: Install plymouth (and themes for BGRT)
      apt:
        name:
          - plymouth
          - plymouth-themes
        state: present

    - name: Ensure quiet splash on kernel cmdline
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"'
        create: yes
      notify: update-grub

    - name: Set timeout to 0 in grub
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_TIMEOUT='
        line: 'GRUB_TIMEOUT=0'
        create: yes
      notify: update-grub
      
    - name: Set GRUB_TIMEOUT_STYLE
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_TIMEOUT_STYLE='
        line: 'GRUB_TIMEOUT_STYLE=hidden'
        create: yes
      notify: update-grub

    - name: Keep GRUB payload into kernel (no mode switch flicker)
      lineinfile:
        path: /etc/default/grub
        regexp: '^#?GRUB_GFXPAYLOAD_LINUX='
        line: 'GRUB_GFXPAYLOAD_LINUX=keep'
        create: yes
      notify: update-grub

    - name: Set Plymouth theme to BGRT and rebuild initramfs
      command: plymouth-set-default-theme -R bgrt
    # ---------------------------------------------------------------

    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - sudo
        state: present

    - name: Set root password
      user:
        name: root
        password: "{{ root_password | password_hash('sha512') }}"

    - name: Create docker group
      group:
        name: docker
        state: present

    - name: Create centroid user with sudo & docker group
      user:
        name: centroid
        password: "{{ centroid_password | password_hash('sha512') }}"
        shell: /bin/bash
        groups: sudo,docker
        append: yes
        create_home: yes

    - name: Allow centroid user passwordless sudo
      copy:
        dest: /etc/sudoers.d/centroid
        content: "centroid ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'

    - name: Prepare Docker keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Set correct permissions on Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_lsb.codename }} stable"
        mode: '0644'

    - name: Download and import ZeroTier GPG key
      shell: |
        curl -s 'https://raw.githubusercontent.com/zerotier/ZeroTierOne/main/doc/contact@zerotier.com.gpg' | gpg --import
      args:
        creates: /etc/apt/trusted.gpg.d/zerotier.gpg

    - name: Run ZeroTier installation script
      shell: |
        curl -s 'https://install.zerotier.com/' | gpg | bash
      args:
        creates: /usr/sbin/zerotier-one

    - name: Update APT cache
      apt:
        update_cache: yes

    - name: Install base packages
      apt:
        name:
          - vim
          - openssh-server
          - ufw
          - unattended-upgrades
          - apt-listchanges
          - network-manager
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - procps
          - fish
          - firmware-misc-nonfree
          - intel-media-va-driver
          - libgl1-mesa-dri
          - libgbm1
          - mesa-vulkan-drivers
        state: present

    - name: Check if running in container
      set_fact:
        is_container: "{{ ansible_virtualization_type == 'docker' }}"

    - name: Add PolicyKit rule to allow centroid user to manage NetworkManager
      copy:
        dest: /etc/polkit-1/rules.d/50-networkmanager-container.rules
        content: |
          // PolicyKit rule to allow uid 1000 to manage NetworkManager
          // This file should be copied to the host system at:
          // /etc/polkit-1/rules.d/50-networkmanager-container.rules

          polkit.addRule(function(action, subject) {
              if (action.id.indexOf("org.freedesktop.NetworkManager.") == 0 && subject.user == "centroid") {
                  return polkit.Result.YES;
              }
          });
        mode: '0644'

    - name: Add PolicyKit rule to allow centroid user to set the clock and NTP
      copy:
        dest: /etc/polkit-1/rules.d/49-centroid-clock.rules
        content: |
          // PolicyKit rule to allow uid 1000 to set the host clock.
          //
          // systemd ships every timedate1 setter, and timesync1's
          // set-runtime-servers, as auth_admin_keep. The HMI container has
          // no polkit agent to answer that prompt, so without this rule the
          // Date & Time section on its About Linux page can read the clock
          // and the sync status -- those need no authorisation -- but every
          // change is refused with
          // org.freedesktop.DBus.Error.InteractiveAuthorizationRequired.
          //
          // Matches 50-networkmanager-container.rules on subject.user rather
          // than the local && active && isInGroup form Debian uses: the HMI
          // process lives in /system.slice/docker-<id>.scope with no logind
          // session, so polkit sees it as neither local nor active and a
          // rule of that shape would never fire.
          //
          // Check with the container's own pid, not a shell -- a login shell
          // has a session and the container does not:
          //   pkcheck --action-id org.freedesktop.timedate1.set-ntp \
          //           --process $(docker inspect -f '{{ '{{' }}.State.Pid{{ '}}' }}' flutter)

          polkit.addRule(function(action, subject) {
              var allowed = [
                  "org.freedesktop.timedate1.set-time",
                  "org.freedesktop.timedate1.set-timezone",
                  "org.freedesktop.timedate1.set-local-rtc",
                  "org.freedesktop.timedate1.set-ntp",
                  "org.freedesktop.timesync1.set-runtime-servers"
              ];

              if (allowed.indexOf(action.id) !== -1 && subject.user == "centroid") {
                  return polkit.Result.YES;
              }
          });
        mode: '0644'

    - name: Add PolicyKit rule to allow centroid user to reboot and power off
      copy:
        dest: /etc/polkit-1/rules.d/49-centroid-power.rules
        content: |
          // PolicyKit rule to allow uid 1000 to reboot and power off the host.
          //
          // The HMI's About Linux page has Reboot and Power Off buttons that
          // call org.freedesktop.login1 Reboot()/PowerOff(). logind allows
          // those for an active local session, which the HMI container is
          // not -- it lives in /system.slice/docker-<id>.scope with no
          // logind session -- so without this rule both are refused.
          //
          // The -multiple-sessions variants are needed too: a station
          // normally has more than one session (the seat plus the manager),
          // and logind checks the multiple-sessions action whenever another
          // session exists.
          //
          // Deliberately NOT granting reboot-ignore-inhibit or
          // power-off-ignore-inhibit. Those force shutdown past a *block*
          // inhibitor; the inhibitors on a station are delay-mode
          // (unattended-upgrades, ModemManager, NetworkManager), which do not
          // need it. Leaving them out means a genuine block -- an upgrade
          // deliberately holding shutdown -- still stops the button, and the
          // page reports why instead of interrupting it.

          polkit.addRule(function(action, subject) {
              var allowed = [
                  "org.freedesktop.login1.reboot",
                  "org.freedesktop.login1.reboot-multiple-sessions",
                  "org.freedesktop.login1.power-off",
                  "org.freedesktop.login1.power-off-multiple-sessions"
              ];

              if (allowed.indexOf(action.id) !== -1 && subject.user == "centroid") {
                  return polkit.Result.YES;
              }
          });
        mode: '0644'

    - name: Ensure NetworkManager is enabled
      systemd:
        name: NetworkManager
        enabled: yes
        state: started
      when: not is_container

    - name: Reinitialize /etc/network/interfaces with default config
      copy:
        dest: /etc/network/interfaces
        content: |
          # This file describes the network interfaces available on your system
          # and how to activate them. For more information, see interfaces(5).

          # The loopback network interface
          auto lo
          iface lo inet loopback
        mode: '0644'
      when: not is_container

    - name: Disable systemd networking service
      systemd:
        name: networking.service
        enabled: no
      when: not is_container

    - name: Allow SSH & VNC through UFW
      ufw:
        rule: allow
        port: "{{ item }}"
      loop: [22, 5900]
      when: not is_container

    - name: Enable UFW
      ufw:
        state: enabled
      when: not is_container

    - name: Configure unattended-upgrades
      copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        content: |
          Unattended-Upgrade::Origins-Pattern {
            "o=Debian,n={{ ansible_lsb.codename }},l=Debian-Security";
          };
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:00";

    - name: Schedule weekly unattended runs
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "7";
          APT::Periodic::Unattended-Upgrade "7";

  handlers:
    - name: update-grub
      command: update-grub