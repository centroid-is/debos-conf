---
- name: Configure freshly installed Debian
  hosts: localhost
  connection: local
  become: yes
  vars:
    root_password: "{{ root_password }}"
    centroid_password: "{{ centroid_password }}"
  tasks:
    - name: Ensure prereqs are installed
      apt:
        name:
          - systemd-timesyncd
          - python3-passlib
          - lsb-release
        state: present

    - name: Enable NTP (systemd-timesyncd)
      command: timedatectl set-ntp true
      changed_when: false

    - name: Wait for NTP sync
      shell: timedatectl show -p NTPSynchronized --value
      register: ntp_sync
      retries: 15
      delay: 2
      until: ntp_sync.stdout == "yes"
      changed_when: false

    - name: Set timezone from -e tz=... or $TZ or default
      timezone:
        name: "{{ tz | default(lookup('env','TZ'), true) | default('Atlantic/Reykjavik', true) }}"

    # --- Keep UEFI logo via Plymouth BGRT -----------
    - name: Install plymouth (and themes for BGRT)
      apt:
        name:
          - plymouth
          - plymouth-themes
        state: present

    - name: Ensure quiet splash on kernel cmdline
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"'
        create: yes
      notify: update-grub

    - name: Set timeout to 0 in grub
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_TIMEOUT='
        line: 'GRUB_TIMEOUT=0'
        create: yes
      notify: update-grub
      
    - name: Set GRUB_TIMEOUT_STYLE
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_TIMEOUT_STYLE='
        line: 'GRUB_TIMEOUT_STYLE=hidden'
        create: yes
      notify: update-grub

    - name: Keep GRUB payload into kernel (no mode switch flicker)
      lineinfile:
        path: /etc/default/grub
        regexp: '^#?GRUB_GFXPAYLOAD_LINUX='
        line: 'GRUB_GFXPAYLOAD_LINUX=keep'
        create: yes
      notify: update-grub

    - name: Set Plymouth theme to BGRT and rebuild initramfs
      command: plymouth-set-default-theme -R bgrt
    # ---------------------------------------------------------------

    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - sudo
        state: present

    - name: Set root password
      user:
        name: root
        password: "{{ root_password | password_hash('sha512') }}"

    - name: Create docker group
      group:
        name: docker
        state: present

    - name: Create centroid user with sudo & docker group
      user:
        name: centroid
        password: "{{ centroid_password | password_hash('sha512') }}"
        shell: /bin/bash
        groups: sudo,docker
        append: yes
        create_home: yes

    - name: Allow centroid user passwordless sudo
      copy:
        dest: /etc/sudoers.d/centroid
        content: "centroid ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'

    - name: Prepare Docker keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Set correct permissions on Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_lsb.codename }} stable"
        mode: '0644'

    - name: Download and import ZeroTier GPG key
      shell: |
        curl -s 'https://raw.githubusercontent.com/zerotier/ZeroTierOne/main/doc/contact@zerotier.com.gpg' | gpg --import
      args:
        creates: /etc/apt/trusted.gpg.d/zerotier.gpg

    - name: Run ZeroTier installation script
      shell: |
        curl -s 'https://install.zerotier.com/' | gpg | bash
      args:
        creates: /usr/sbin/zerotier-one

    - name: Update APT cache
      apt:
        update_cache: yes

    - name: Install base packages
      apt:
        name:
          - vim
          - openssh-server
          - ufw
          - unattended-upgrades
          - apt-listchanges
          - network-manager
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - procps
          - fish
          - firmware-misc-nonfree
          - intel-media-va-driver
          - libgl1-mesa-dri
          - libgbm1
          - mesa-vulkan-drivers
        state: present

    # --- Headless GNOME Keyring for flutter_secure_storage (HOST) ---

    - name: Install headless keyring + libsecret tools
      apt:
        name:
          - dbus-user-session
          - gnome-keyring
          - libsecret-1-0
        state: present

    - name: Get centroid UID
      command: id -u centroid
      register: centroid_uid_cmd
      changed_when: false

    - name: Set centroid_uid fact
      set_fact:
        centroid_uid: "{{ centroid_uid_cmd.stdout }}"

    - name: Create directory for headless keyring password
      file:
        path: /etc/hmi
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Generate persistent keyring password (once)
      shell: "umask 077 && [ -s /etc/hmi/keyring_password ] || openssl rand -base64 32 > /etc/hmi/keyring_password"
      args:
        creates: /etc/hmi/keyring_password

    - name: Ensure keyring password permissions
      file:
        path: /etc/hmi/keyring_password
        owner: root
        group: root
        mode: '0600'

    - name: Create systemd unit for headless GNOME Keyring
      copy:
        dest: /etc/systemd/system/hmi-keyring.service
        mode: '0644'
        content: |
          [Unit]
          Description=Headless GNOME Keyring (Secret Service) for Flutter
          After=network.target user@1000.service
          Before=docker.service docker.socket

          [Service]
          Type=simple
          User=centroid
          Group=centroid
          Environment=HOME=/home/centroid
          Environment=XDG_RUNTIME_DIR=/run/user/1000
          Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus

          # Provide the password as a runtime credential (readable to this service)
          LoadCredential=keyring_password:/etc/hmi/keyring_password

          # 1) create/unlock the login keyring using our credential
          # 2) start the secrets component in the foreground (owns org.freedesktop.secrets)
          ExecStart=/bin/sh -lc 'gnome-keyring-daemon --unlock < /run/credentials/%N.service/keyring_password; exec gnome-keyring-daemon --start --components=secrets --foreground'

          Restart=always
          RestartSec=2s

          [Install]
          WantedBy=multi-user.target

    - name: Enable linger for centroid user
      command: loginctl enable-linger centroid

    - name: Reload systemd and enable/start hmi-keyring
      systemd:
        name: hmi-keyring.service
        daemon_reload: yes
        enabled: yes
        state: started

    - name: Enable docker.service
      systemd:
        name: docker.service
        enabled: yes
        state: started
    # ---------------------------------------------------------------

    - name: Check if running in container
      set_fact:
        is_container: "{{ ansible_virtualization_type == 'docker' }}"

    - name: Ensure NetworkManager is enabled
      systemd:
        name: NetworkManager
        enabled: yes
        state: started
      when: not is_container

    - name: Allow SSH & VNC through UFW
      ufw:
        rule: allow
        port: "{{ item }}"
      loop: [22, 5900]
      when: not is_container

    - name: Enable UFW
      ufw:
        state: enabled
      when: not is_container

    - name: Configure unattended-upgrades
      copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        content: |
          Unattended-Upgrade::Origins-Pattern {
            "o=Debian,n={{ ansible_lsb.codename }},l=Debian-Security";
          };
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:00";

    - name: Schedule weekly unattended runs
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "7";
          APT::Periodic::Unattended-Upgrade "7";

  handlers:
    - name: update-grub
      command: update-grub