name: Test Ansible Playbook

on:
  push:
    paths:
      - 'ansible-playbook.yml'
      - '.github/workflows/test-ansible.yaml'
  pull_request:
    paths:
      - 'ansible-playbook.yml'
      - '.github/workflows/test-ansible.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Syntax check
        run: ansible-playbook --syntax-check ansible-playbook.yml

      # Every `copy:` body is Jinja-templated by Ansible before it is written,
      # so a literal `{{` in a config file -- a polkit rule quoting a
      # `docker inspect -f` format string, say -- has to be escaped or the
      # play dies at apply time on a station. --syntax-check does not look
      # inside these, so check them here.
      - name: Parse templated file contents
        run: |
          python3 - <<'PY'
          import yaml, jinja2, sys

          play = yaml.safe_load(open('ansible-playbook.yml'))[0]
          env = jinja2.Environment()
          failed = []

          for task in play.get('tasks', []):
              body = (task.get('copy') or {}).get('content')
              if not body:
                  continue
              try:
                  # Parse, not render: several bodies legitimately reference
                  # facts like ansible_lsb that only exist during a real run,
                  # and rendering would fail on those. Parsing still catches
                  # the delimiter mistakes this exists for.
                  env.parse(body)
              except jinja2.TemplateSyntaxError as exc:
                  failed.append((task.get('name', '<unnamed>'), exc))

          for name, exc in failed:
              print(f'::error::{name}: {exc}')
          sys.exit(1 if failed else 0)
          PY

      # Applying the whole playbook to a GitHub runner cannot succeed: it
      # provisions bare-metal Debian, so it reaches for things a runner has no
      # business having -- Plymouth's BGRT theme, GRUB, UFW, a real seat. It
      # is kept because the output is still useful to read when a task is
      # changed, but it does not gate the PR on the runner not being a
      # station.
      - name: Run Ansible playbook (informational)
        continue-on-error: true
        run: |
          ansible-playbook -i localhost, \
            -e 'root_password=testroot' \
            -e 'centroid_password=testcentroid' \
            ansible-playbook.yml
